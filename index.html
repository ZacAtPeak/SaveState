<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

<body>
    <main class="container">
      <div class="actor-list" id="actor-list">
        <div class="actor-list-header">Actors</div>
        <div class="actor-list-items" id="actor-list-items"></div>
        <div class="resize-handle" id="resize-handle"></div>
      </div>

      <div id="main-content">
        <div class="toolbar">
          <button id="wiki-btn" class="icon-btn" title="Wiki">
            <svg role="img" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6s-2-2-4-2-5 2-5 2v14s3-2 5-2 4 2 4 2c1.333-1.333 2.667-2 4-2 1.333 0 3 .667 5 2V6c-2-1.333-3.667-2-5-2-1.333 0-2.667.667-4 2z"/><path stroke-linecap="round" d="M12 6v14"/></svg>
          </button>
          <button id="dice-btn" class="icon-btn" title="Dice Roller">
            <svg role="img" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 14 18 14 15 7 10 17 7 11 5 14 3 14"/></svg>
          </button>
          <button id="search-btn" class="icon-btn" title="Search">
            <svg role="img" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
          <button id="settings-btn" class="icon-btn" title="Settings">
            <svg role="img" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>

        <div class="encounter-tracker" id="encounter-tracker">
          <div class="encounter-tracker-header">
            <span>Encounter Tracker</span>
            <div class="encounter-tracker-actions">
              <button class="encounter-btn" id="encounter-prev">◀</button>
              <span id="encounter-round">Round 1</span>
              <button class="encounter-btn" id="encounter-next">▶</button>
            </div>
          </div>
          <div class="encounter-tracker-items" id="encounter-tracker-items">
            <span class="empty-hint">No combatants in encounter</span>
          </div>
          <div class="resize-handle-horizontal" id="tracker-resize-handle"></div>
        </div>

        <div id="app"></div>
      </div>

      <div id="settings-modal" class="modal">
        <div class="modal-content">
          <div class="modal-header">
            <h2>Settings</h2>
            <button id="close-modal" class="close-btn">&times;</button>
          </div>
          <div class="modal-body">
            <label for="game-system-select">Game System:</label>
            <select id="game-system-select">
              <option value="">All Systems</option>
            </select>
            <button id="reset-db-btn" style="margin-top: 1rem; width: 100%;">Reset Database</button>
          </div>
        </div>
      </div>

      <div id="initiative-modal" class="modal">
        <div class="modal-content">
          <div class="modal-header">
            <h2>Set Initiative</h2>
          </div>
          <div class="modal-body">
            <p id="initiative-actor-name" style="margin-bottom: 1rem; font-weight: 500;"></p>
            <label for="initiative-input">Roll or enter initiative:</label>
            <input type="number" id="initiative-input" placeholder="Enter initiative roll" />
            <button id="initiative-confirm" style="margin-top: 1rem; width: 100%;">Add to Encounter</button>
          </div>
        </div>
      </div>
      <div id="wiki-modal" class="modal">
  <div class="modal-content wiki-modal-content">
    <div class="wiki-header">
      <h2>Wiki</h2>
      <button id="close-wiki" class="close-btn">&times;</button>
    </div>
    <div class="wiki-body">
      <div class="wiki-sidebar">
        <div class="wiki-list" id="wiki-list"></div>
      </div>
      <div class="wiki-detail" id="wiki-detail">
        <span class="empty-hint">Select an entity to view details</span>
      </div>
    </div>
  </div>
</div>
    </main>
  </body>
</html>
